secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mben-cha/data/mariadb_data
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mben-cha/data/wordpress_data


networks:
  inception:
    driver: bridge

services:
  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    env_file: .env
    secrets:
      - db_password
      - credentials
    networks:
      - inception 
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      mariadb:
          condition: service_healthy
    restart: on-failure
  
  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin -u root -p$(cat /run/secrets/db_root_password) ping --silent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  nginx:
    image: nginx
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - wordpress
    restart: on-failure
