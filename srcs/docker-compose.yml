secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: non
      o: bind
      device: /home/mben-cha/data/mariadb_data
  wordpress_data:
    driver: local
    driver_opts:
      type: non
      o: bind
      device: /home/mben-cha/data/wordpress_data


networks:
  inception:

services:
  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    env_file: .env
    secrets:
      - db_password
    networks:
      - inception 
    volumes:
      - wordpress_data:/var/www/wordpress
  
  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql

  nginx:
    image: nginx
    build: ./requirements/nginx
    networks:
      - inception
    ports:
      - 443:443
    volumes:
      - wordpress_data:/var/www/wordpress
